<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Neko v8 – bộ biểu cảm</title><link rel="stylesheet" href="../style.css">
<style>body{padding:20px;font-family:system-ui;background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.c{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;text-align:center}.c .mwrap{margin:0 auto;width:110px;height:110px}b{display:block;margin-top:4px;color:var(--text)}</style></head>
<body><h1 style="font-size:20px;color:var(--text)">Neko v8 – 16 trạng thái</h1><div class="grid" id="g"></div>
<script src="../mascot.js"></script><script>document.getElementById('g').innerHTML=NK_STATES.map(s=>`<div class="c"><div class="mwrap" data-state="${s}"></div><b>${s}</b></div>`).join('')</script></body></html>
