name: Content integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install numpy==2.3.2 av==16.1.0 playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix .cache-content/ci --no-save ts-fsrs@5.4.2
      - run: python -m unittest discover -s tests -p content_test.py
      - run: python tools/content/build.py --draft
      - run: python tools/content/verify_audio.py
      - run: python tools/content/build.py
      - run: git diff --exit-code -- data content/ids.json
      - run: node --test tests/content.test.js tests/learning-plan.test.js
      - run: python -m unittest discover -s tests -p study_order_test.py
      - run: python -m unittest discover -s tests -p oxford_audit_test.py
      - run: python tests/learning_plan_browser_test.py
      - run: NODE_PATH="$PWD/.cache-content/ci/node_modules" node tests/srs.test.js
      - run: node tests/pron.test.js
      - run: python tests/content_browser_test.py
